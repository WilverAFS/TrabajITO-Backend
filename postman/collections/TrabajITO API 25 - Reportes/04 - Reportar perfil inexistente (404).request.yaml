$kind: http-request
url: "{{base_url}}/api/v1/reportes"
method: POST
headers:
  Accept: "\tapplication/json"
  Content-Type: application/json
body:
  type: json
  content: "\r

    {\r

    \  \"tipo_objetivo\": \"PERFIL\",\r

    \  \"id_objetivo\": 999999,\r

    \  \"motivo\": \"Información falsa\",\r

    \  \"descripcion\": \"Prueba de reporte para un perfil inexistente.\"\r

    }\r\n"
auth:
  type: bearer
  credentials:
    token: "{{token_cliente}}"
scripts:
  - type: afterResponse
    code: |

      pm.test('Devuelve 404 por perfil inexistente', function () {
          pm.response.to.have.status(404);
      });

      pm.test('Devuelve RESOURCE_NOT_FOUND', function () {
          const json = pm.response.json();

          pm.expect(json.success).to.eql(false);
          pm.expect(json.error_code).to.eql('RESOURCE_NOT_FOUND');
      });

      pm.test('No encuentra el objetivo del reporte', function () {
          const json = pm.response.json();

          pm.expect(json.message).to.eql(
              'El objetivo del reporte no existe.'
          );
      });
    language: text/javascript
order: 5000
