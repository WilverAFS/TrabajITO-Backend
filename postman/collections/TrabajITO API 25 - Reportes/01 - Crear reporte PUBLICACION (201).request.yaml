$kind: http-request
url: "{{base_url}}/api/v1/reportes"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "\r

    {\r

    \  \"tipo_objetivo\": \"PUBLICACION\",\r

    \  \"id_objetivo\": 2,\r

    \  \"motivo\": \"Contenido engañoso\",\r

    \  \"descripcion\": \"Esta publicación contiene información incorrecta.\"\r

    }\r\n"
auth:
  type: bearer
  credentials:
    token: "{{token_cliente}}"
scripts:
  - type: afterResponse
    code: |

      pm.test('Devuelve 201 al crear reporte', function () {
          pm.response.to.have.status(201);
      });

      pm.test('El reporte se crea correctamente', function () {
          const json = pm.response.json();

          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.tipo_objetivo).to.eql('PUBLICACION');
      });

      pm.test('El reporte inicia como Pendiente', function () {
          const json = pm.response.json();

          pm.expect(json.data.estado.estado_reporte).to.eql('Pendiente');
      });

      pm.test('Devuelve el ID del reporte', function () {
          const json = pm.response.json();

          pm.expect(json.data.id_reporte).to.be.a('number');
      });
    language: text/javascript
order: 2000
