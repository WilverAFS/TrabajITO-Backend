$kind: http-request
url: "{{base_url}}/api/v1/reportes"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "\r

    {\r

    \  \"tipo_objetivo\": \"PUBLICACION\",\r

    \  \"id_objetivo\": 2,\r

    \  \"motivo\": \"Contenido engañoso\",\r

    \  \"descripcion\": \"Esta publicación contiene información incorrecta.\"\r

    }\r\n"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |

      pm.test('Devuelve 401 sin autenticación', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Indica que el usuario no está autenticado', function () {
          const json = pm.response.json();

          pm.expect(json.message).to.eql('Unauthenticated.');
      });
    language: text/javascript
order: 4000
