$kind: http-request
url: "{{base_url}}/api/v1/auth/login"
method: POST
body:
  type: urlencoded
  content:
    correo: "{{correo_cliente}}"
    password: "{{password_cliente}}"
    device_name: Postman API 25
scripts:
  - type: beforeRequest
    code: "\r

      const correo = pm.collectionVariables.get('correo_cliente');\r

      const password = pm.collectionVariables.get('password_cliente');\r

      \r

      pm.request.body.urlencoded.upsert({\r

      \    key: 'correo',\r

      \    value: String(correo ?? '').trim()\r

      });\r

      \r

      pm.request.body.urlencoded.upsert({\r

      \    key: 'password',\r

      \    value: String(password ?? '')\r

      });\r\n"
    language: text/javascript
  - type: afterResponse
    code: "\r

      pm.test('Login devuelve 200', function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      let json = {};\r

      \r

      try {\r

      \    json = pm.response.json();\r

      } catch (e) {}\r

      \r

      const token =\r

      \    (json.data && (json.data.token || json.data.access_token))\r

      \    || json.token;\r

      \r

      pm.test('Login devuelve token', function () {\r

      \    pm.expect(token).to.be.a('string').and.not.empty;\r

      });\r

      \r

      if (token) {\r

      \    pm.collectionVariables.set('token_cliente', token);\r

      }\r\n"
    language: text/javascript
order: 425
