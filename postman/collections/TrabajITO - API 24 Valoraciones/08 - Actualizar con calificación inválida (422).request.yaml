$kind: http-request
url: "{{base_url}}/api/v1/valoraciones/{{id_valoracion}}"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: '{"calificacion":6}'
scripts:
