$kind: http-request
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: urlencoded
  content:
    correo: "\t{{correo_cliente}}"
    password: "\t{{password_cliente}}"
    device_name: Postman API 24
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |
      pm.environment.unset('token_cliente');
      pm.environment.unset('id_valoracion');



      const correo = pm.environment.get('correo_cliente');
      const password = pm.environment.get('password_cliente');

      pm.request.body.urlencoded.upsert({
          key: 'correo',
          value: String(correo ?? '').trim()
      });

      pm.request.body.urlencoded.upsert({
          key: 'password',
          value: String(password ?? '').trim()
      });
    language: text/javascript
  - type: afterResponse
    code: |+
      pm.test('Login devuelve 200', function () { pm.response.to.have.status(200); });
      var json = {};
      try { json = pm.response.json(); } catch (e) {}
      var token = (json.data && (json.data.token || json.data.access_token)) || json.token;
      pm.test('Login devuelve token', function () { pm.expect(token).to.be.a('string').and.not.empty; });
      if (token) { pm.environment.set('token_cliente', token); }

    language: text/javascript
order: 1000
