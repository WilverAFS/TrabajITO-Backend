$kind: http-request
url: "{{base_url}}/api/v1/publicaciones/999999999/valoracion"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: '{"calificacion":5}'
auth:
  type: bearer
  credentials:
    token: "{{token_cliente}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Publicación inexistente devuelve 404', function () { pm.response.to.have.status(404); });
      pm.test('Código de error correcto', function () { pm.expect(pm.response.json().error_code).to.eql('RESOURCE_NOT_FOUND'); });
    language: text/javascript
order: 4000
