$kind: http-request
description: Verifica que la ruta exige auth:sanctum.
url: "{{base_url}}/api/v1/admin/solicitudes-habilitacion"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 401", function () { pm.response.to.have.status(401); });
      const body = pm.response.json();
      pm.test("Formato de error del contrato", function () { pm.expect(body.success).to.eql(false); pm.expect(body).to.have.property("message"); pm.expect(body).to.have.property("error_code"); });
      pm.test("Sin autenticar", () => pm.expect(body.error_code).to.eql("UNAUTHENTICATED"));
    language: text/javascript
order: 1000
