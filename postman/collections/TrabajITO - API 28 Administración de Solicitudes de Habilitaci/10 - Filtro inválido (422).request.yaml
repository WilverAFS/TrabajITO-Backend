$kind: http-request
description: Ordenamiento no permitido.
url: "{{base_url}}/api/v1/admin/solicitudes-habilitacion?sort=nombre"
method: GET
headers:
  Accept: application/json
queryParams:
  sort: nombre
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 422", function () { pm.response.to.have.status(422); });
      const body = pm.response.json();
      pm.test("Formato de error del contrato", function () { pm.expect(body.success).to.eql(false); pm.expect(body).to.have.property("message"); pm.expect(body).to.have.property("error_code"); });
      pm.test("Ordenamiento validado", function () { pm.expect(body.errors).to.have.property("sort"); });
    language: text/javascript
order: 11000
