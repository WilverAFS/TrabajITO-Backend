$kind: http-request
description: Comprueba RESOURCE_NOT_FOUND en transición.
url: "{{base_url}}/api/v1/admin/solicitudes-habilitacion/999999999/aprobar"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "comentario_revision": "Test"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 404", function () { pm.response.to.have.status(404); });
      const body = pm.response.json();
      pm.test("Formato de error del contrato", function () { pm.expect(body.success).to.eql(false); pm.expect(body).to.have.property("message"); pm.expect(body).to.have.property("error_code"); });
      pm.test("Código estable", function () { pm.expect(body.error_code).to.eql("RESOURCE_NOT_FOUND"); });
    language: text/javascript
order: 10000
