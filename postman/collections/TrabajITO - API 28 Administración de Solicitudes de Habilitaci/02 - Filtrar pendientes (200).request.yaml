$kind: http-request
description: Filtra las solicitudes pendientes y ordena por fecha.
url: "{{base_url}}/api/v1/admin/solicitudes-habilitacion?id_estado=1&page=1&per_page=15&sort=fecha_solicitud&direction=asc"
method: GET
headers:
  Accept: application/json
queryParams:
  id_estado: "1"
  page: "1"
  per_page: "15"
  sort: fecha_solicitud
  direction: asc
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test("Respuesta exitosa del contrato", function () { pm.expect(body.success).to.eql(true); pm.expect(body).to.have.property("data"); });
      pm.test("Solo solicitudes pendientes", function () { pm.expect(body.data).to.be.an("array"); body.data.forEach(s => pm.expect(s.estado.id_estado_solicitud).to.eql(1)); });
    language: text/javascript
order: 3000
