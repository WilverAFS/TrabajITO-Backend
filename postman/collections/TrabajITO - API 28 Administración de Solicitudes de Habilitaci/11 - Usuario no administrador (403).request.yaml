$kind: http-request
description: Define token_usuario con el token de un usuario no administrador.
url: "{{base_url}}/api/v1/admin/solicitudes-habilitacion"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token_usuario}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 403", function () { pm.response.to.have.status(403); });
      const body = pm.response.json();
      pm.test("Formato de error del contrato", function () { pm.expect(body.success).to.eql(false); pm.expect(body).to.have.property("message"); pm.expect(body).to.have.property("error_code"); });
      pm.test("Sin permisos", function () { pm.expect(body.error_code).to.eql("FORBIDDEN"); });
    language: text/javascript
order: 12000
